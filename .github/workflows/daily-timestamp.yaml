name: Fortnightly timestamp print

on:
  schedule:
    - cron: "0 0 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run timestamp script
        run: node scripts/daily-timestamp.js
        env:
          HOOHU_UA: ${{ secrets.HOOHU_UA }}
          HOOHU_PASSWORD: ${{ secrets.HOOHU_PASSWORD }}

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update timestamp print log"
            git push
          else
            echo "No changes to commit"
          fi
